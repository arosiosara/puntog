<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag fondamentale per i dispositivi mobili: adatta la scala allo schermo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soundboard Mobile</title>
    <style>
        /* Definizione dei colori e variabili */
        :root {
            --bg-color: #121212;
            --btn-color: #3498db;
            --btn-active: #2980b9;
            --text-color: #ffffff;
        }

        /* Reset e impostazioni di base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px 10px;
        }

        h1 {
            margin: 15px 0 20px;
            font-size: 1.6rem;
            text-align: center;
        }

        /* Griglia impostata su 3 colonne (3 per riga x 5 righe = 15 bottoni) */
        .soundboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px; /* Spaziatura ridotta per far stare meglio 3 colonne */
            width: 100%;
            max-width: 500px;
        }

        /* Stile dei pulsanti rimpiccioliti per la nuova griglia */
        button {
            background-color: var(--btn-color);
            color: var(--text-color);
            border: none;
            border-radius: 10px;
            min-height: 75px; /* Altezza ridotta per proporzionare le 5 file */
            padding: 6px 4px;
            font-size: 0.85rem; /* Font leggermente più piccolo per evitare testo a capo antiestetico */
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s ease, background-color 0.1s ease;
            
            /* Ottimizzazioni touch */
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* Effetto di pressione del pulsante */
        button:active {
            transform: scale(0.92);
            background-color: var(--btn-active);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
        }

        .icon {
            font-size: 1.4rem; /* Icona ridotta per bilanciare l'altezza */
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <h1>Effetti Sonori</h1>

    <div class="soundboard">
        <!-- 15 pulsanti disposti su 3 colonne x 5 righe -->
        <button data-sound="cane.mp3"><span class="icon">🐶</span>cane</button>
        <button data-sound="clacson.mp3"><span class="icon">🎺</span>clacson</button>
        <button data-sound="creepy.mp3"><span class="icon">👻</span>creepy</button>
        <button data-sound="risata.mp3"><span class="icon">😂</span>risata</button>
        <button data-sound="ruggito.mp3"><span class="icon">🐯</span>ruggito</button>
        <button data-sound="sirena.mp3"><span class="icon">🚨</span>sirena</button>
        <button data-sound="tamburi.mp3"><span class="icon">🥁</span>tamburi</button>
        <button data-sound="suspance.mp3"><span class="icon">👽</span>suspance</button>
        <button data-sound="vetrorotto.mp3"><span class="icon">💥</span>vetro rotto</button>
        <button data-sound="urlo.mp3"><span class="icon">😱</span>urlo</button>
        <button data-sound="pier.mp3"><span class="icon">🚨</span>pier</button>
        <button data-sound="elefante.mp3"><span class="icon">🥁</span>elefante</button>
        <button data-sound="painto.mp3"><span class="icon">👽</span>pianto</button>
        <button data-sound="tosse.mp3"><span class="icon">💥</span>tosse</button>
        <button data-sound="coutdown.mp3"><span class="icon">😱</span>countdown</button>
    </div>

    <script>
        let currentAudio = null;

        const buttons = document.querySelectorAll('.soundboard button');

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const soundFile = button.getAttribute('data-sound');
                
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0; 
                }

                currentAudio = new Audio(soundFile);
                
                currentAudio.play().catch(error => {
                    console.error("Errore nella riproduzione dell'audio:", error);
                    alert(`Impossibile riprodurre ${soundFile}. Assicurati che il file esista nella stessa cartella.`);
                });
            });
        });
    </script>
</body>
</html>
